pergunta: Qual é a estratégia ótima para o Bozó solo (MDP de um jogador), quanto ela vale em média e quanto
  se perde jogando de forma gulosa?
hipoteses:
  H1: 'Objetivo: maximizar a pontuação total esperada do Bozó solo de 10 rodadas (10 casas), regras da
    pauta com D1–D6.'
  H2: 'Boca: +5 só para Fú, Seguida, Quadrada e General, e só se a casa for marcada logo após o 1º lançamento
    da rodada (General de boca = 55).'
  H3: Parar = marcar uma casa. Guardar os 5 dados e 'relançar zero' não é ação (seria dominada).
  H4: 'Após o 1º e o 2º lançamentos o jogador guarda qualquer submulticonjunto de 0 a 4 dados da mão atual
    e relança os demais (D3: dado guardado pode voltar ao copo).'
  H5: 'Qualquer casa livre pode ser marcada a qualquer momento (D6); combinação inválida ou casa de número
    sem a face vale 0. Fú = exatamente 3+2 iguais; Quadrada = exatamente 4+1 (D4: cinco iguais não valem);
    Seguida = 12345 ou 23456 (D5). Casa de número k vale k vezes o nº de dados com face k.'
  H6: 'Desempate da política ótima (empates exatos): marcar antes de relançar; entre casas, a de menor
    índice (Ás<Duque<Terno<Quadra<Quina<Sena<Fú<Seguida<Quadrada<General); entre guardas, mais dados,
    depois maior soma, depois maior tupla decrescente. O desempate não altera valor, distribuição final
    nem probabilidades de completar casas.'
  H7: 'BAIXO fora das contas (E3): pedido às cegas não altera nenhuma probabilidade.'
gulosa:
  G1: Após cada lançamento r, calcula a pontuação imediata de cada casa livre (com +5 de boca se r=1 e
    combinação válida).
  G2: 'Casa escolhida = a de maior pontuação imediata; empate -> menor índice (logo, se tudo dá 0, risca
    a casa livre de menor índice: Ás primeiro, General por último).'
  G3: 'Para e marca a casa escolhida se: r=3; ou ela é combinação (Fú/Seguida/Quadrada/General) com pontos
    > 0; ou a mão tem cinco iguais.'
  G4: Senão guarda todos os dados da face mais frequente (empate -> a face maior; se todos diferem, guarda
    só o maior dado) e relança o resto.
colas:
  definicao: 'Uma cola é um par (tabela de preços p, conjunto de emendas R); ''gulosa'' = sem tabela.
    Casas 0..9 = Ás, Duque, Terno, Quadra, Quina, Sena, Fú, Seguida, Quadrada, General. Em cada lançamento
    r = 1, 2, 3 de uma rodada, com a mão d e o conjunto L de casas livres, faz-se nesta ordem: (1) PONTOS:
    pts(b) = pontuação imediata da casa b em L com a mão d (H5; +5 de boca se r = 1 e b é combinação válida).
    (2) CASA ESCOLHIDA h: sem tabela, a de maior pts(b), empate -> menor índice (G1–G2); com tabela, a
    de maior pts(b) − p_b, empate -> menor índice (pauta H5). (3) PARADA: marca h (com pts(h) pontos;
    0 = riscar) se r = 3; ou se h é Fú/Seguida/Quadrada/General com pts(h) > 0; ou se a mão tem cinco
    dados iguais (G3) — salvo as exceções das emendas quad_gen e fu_alto. (4) GUARDA (se não parou): guarda-base
    G4 = todos os dados da face mais frequente (empate: a maior face; se as 5 faces são distintas, só
    o maior dado) ou, com a emenda alvo, a guarda-alvo; em seguida, se seg4x, doispar ou fu_alto se aplica,
    ela substitui a guarda (nunca mais de uma se aplica à mesma mão). Relança o resto. Sem tabela e sem
    emendas, isto é exatamente a gulosa G1–G4.'
  emendas:
    seg4x:
      itens_cola: 3
      texto: 'Seguida livre e a mão tem 4 faces diferentes que pertencem a uma mesma Seguida (1-2-3-4-5
        ou 2-3-4-5-6), no 1º ou 2º lançamento, sem parar: guarde um dado de cada uma dessas 4 faces e
        relance o outro. Se as duas Seguidas servem (ex.: 12346), use a alta (2346).'
    quad_gen:
      itens_cola: 2
      texto: 'General livre e a casa escolhida é a Quadrada, no 1º ou 2º lançamento: não marque; guarde
        os 4 dados iguais e relance o outro.'
    alvo:
      itens_cola: 2
      texto: 'Ao guardar por face, só conta face ''útil'': aquela cuja casa de número está livre, ou qualquer
        face se Fú, Quadrada ou General estiver livre. Guarde todos os dados da face útil mais frequente
        na mão (empate: a maior). Se a mão não tem nenhuma face útil: com a Seguida livre, guarde um dado
        de cada face que a mão tem em comum com a Seguida (baixa ou alta) de mais faces em comum (empate:
        a alta); sem a Seguida livre, relance os 5.'
    risca_gen:
      itens_cola: 1
      texto: Quando nenhuma casa livre pontua, risque o General (se livre); senão a de menor índice. (Só
        na marcação por pontos, sem preços.)
    doispar:
      itens_cola: 3
      texto: 'Fú livre, 2º lançamento, mão com dois pares e um avulso, sem parar: guarde os dois pares
        e relance o avulso.'
    fu_alto:
      itens_cola: 3
      texto: '2º lançamento, casa escolhida = Fú, a trinca do Fú é de 4, 5 ou 6 e (Quadrada ou General)
        livre: não marque; guarde a trinca e relance os outros dois.'
