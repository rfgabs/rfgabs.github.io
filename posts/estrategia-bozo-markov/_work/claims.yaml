  R4: alvo + seg4x + quad_gen + doispar
  protagonistas:
    (i): 'sozinha_int + R4: preço = valor da casa jogada sozinha (C10–C14) arredondado ao inteiro mais
      próximo (Ás 2, Duque 4, Terno 6, Quadra 8, Quina 11, Sena 13, Fú 7, Seguida 8, Quadrada 11, General
      2) + R4'
    (ii): '2face_8_2 + R4: casa de número = 2 × a face; Fú, Seguida, Quadrada 8; General 2 + R4'
  itens_cola: 'Medida de complexidade (pauta H4): cada teste que o jogador faz = 1 item; cada número a
    decorar = 1 item (uma fórmula que gera vários números, ex. ''2 × a face'', = 1 item); a regra de argmax
    ''marque a de maior pontos − preço'' = 1 item; a ação (conclusão) = 0; a gulosa G1–G4 = 0. Tabela
    de 10 preços + argmax = 11; ''2 × face; combinações 8; General 2'' + argmax = 4. Itens de cada emenda:
    seg4x 3, quad_gen 2, alvo 2, risca_gen 1, doispar 3, fu_alto 3. Itens de uma cola = itens da tabela
    + soma dos itens das emendas. Checagem: nº de regras = (1 se há tabela) + nº de emendas.'
  ids: id de cola = <nome da tabela ou 'gulosa'> seguido de '+emenda' para cada emenda, na ordem seg4x,
    quad_gen, alvo, risca_gen, doispar, fu_alto.
  rodada_perfeita: 'Teto NÃO executável à mesa: com uma tabela de preços p, em cada rodada o jogador escolhe
    guardas (quaisquer, H4) e casa para maximizar E[pts(casa marcada) − p_casa] na rodada (programação
    dinâmica dos 3 lançamentos; desempate H6). Equivale a resolver a equação de Bellman da rodada com
    valor futuro aditivo V(S'') = c_|S''| + soma dos preços das casas de S''.'
  iteracao_politica: 'pi_0 = gulosa G1–G4; pi_{k+1}: em cada cartela S, joga a rodada de forma ótima (3
    lançamentos, guardas H4, desempate H6) maximizando E[pts(b) + E^{pi_k}(S sem b)], com E^{pi_k} o valor
    exato de pi_k em cada cartela.'
