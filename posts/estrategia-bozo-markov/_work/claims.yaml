pergunta: Qual é a estratégia ótima para o Bozó solo (MDP de um jogador), quanto ela vale em média e quanto
  se perde jogando de forma gulosa?
hipoteses:
  H1: 'Objetivo: maximizar a pontuação total esperada do Bozó solo de 10 rodadas (10 casas), regras da
    pauta com D1–D6.'
  H2: 'Boca: +5 só para Fú, Seguida, Quadrada e General, e só se a casa for marcada logo após o 1º lançamento
    da rodada (General de boca = 55).'
  H3: Parar = marcar uma casa. Guardar os 5 dados e 'relançar zero' não é ação (seria dominada).
  H4: 'Após o 1º e o 2º lançamentos o jogador guarda qualquer submulticonjunto de 0 a 4 dados da mão atual
    e relança os demais (D3: dado guardado pode voltar ao copo).'
  H5: 'Qualquer casa livre pode ser marcada a qualquer momento (D6); combinação inválida ou casa de número
    sem a face vale 0. Fú = exatamente 3+2 iguais; Quadrada = exatamente 4+1 (D4: cinco iguais não valem);
    Seguida = 12345 ou 23456 (D5). Casa de número k vale k vezes o nº de dados com face k.'
  H6: 'Desempate da política ótima (empates exatos): marcar antes de relançar; entre casas, a de menor
    índice (Ás<Duque<Terno<Quadra<Quina<Sena<Fú<Seguida<Quadrada<General); entre guardas, mais dados,
    depois maior soma, depois maior tupla decrescente. O desempate não altera valor, distribuição final
    nem probabilidades de completar casas.'
  H7: 'BAIXO fora das contas (E3): pedido às cegas não altera nenhuma probabilidade.'
gulosa:
  G1: Após cada lançamento r, calcula a pontuação imediata de cada casa livre (com +5 de boca se r=1 e
    combinação válida).
  G2: 'Casa escolhida = a de maior pontuação imediata; empate -> menor índice (logo, se tudo dá 0, risca
    a casa livre de menor índice: Ás primeiro, General por último).'
  G3: 'Para e marca a casa escolhida se: r=3; ou ela é combinação (Fú/Seguida/Quadrada/General) com pontos
    > 0; ou a mão tem cinco iguais.'
  G4: Senão guarda todos os dados da face mais frequente (empate -> a face maior; se todos diferem, guarda
    só o maior dado) e relança o resto.
