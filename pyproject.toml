[project]
name = "data-overdrive"
version = "0.1.0"
description = "Blog Data Overdrive (Quarto) — ambiente de cálculo e renderização"
requires-python = ">=3.12"
dependencies = [
    # renderização
    "quarto-cli",
    "jupyter",
    "ipykernel",
    # matemática simbólica
    "sympy",
    # computação e estatística
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    # estatística, grafos e teoria dos jogos
    "statsmodels",
    "networkx",
    "nashpy",
    # registro de afirmações e testes
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
# deep RL — pesado (torch); só quando RL tabular não couber: uv sync --extra rl
rl = ["gymnasium", "stable-baselines3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
